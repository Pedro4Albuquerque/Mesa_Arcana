name: Daeva - Auto Meditar

on:
  schedule:
    # Executa a cada 2 horas. GitHub usa UTC; minuto 17 evita o pico do início da hora.
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'bot.js'
      - 'package.json'
      - '.github/workflows/meditar.yml'

permissions:
  contents: write

concurrency:
  group: daeva-auto-meditar
  cancel-in-progress: false

jobs:
  meditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # O config.json funciona sozinho. Estes Secrets são apenas overrides opcionais.
      DAEVA_USER: ${{ secrets.DAEVA_USER }}
      DAEVA_PASSWORD: ${{ secrets.DAEVA_PASSWORD }}
      DAEVA_SHEET_PASSWORD: ${{ secrets.DAEVA_SHEET_PASSWORD }}

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar código
        run: npm run check

      - name: Executar auto meditação
        run: npm start

      - name: Salvar histórico no repositório
        if: always()
        shell: bash
        run: |
          if [ ! -f logs/historico.log ]; then
            echo "Arquivo de histórico não foi criado nesta execução."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/historico.log

          if git diff --cached --quiet; then
            echo "Sem novas linhas de histórico para salvar."
            exit 0
          fi

          git commit -m "chore: update meditation history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daeva-diagnostico-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
